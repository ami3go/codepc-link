name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest

  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: |
          node --check site/js/protocol.mjs
          node --check site/js/bluetooth.mjs
          node --check site/js/app.mjs
          node --check site/js/rfcomm.mjs
          node --check site/js/rfcomm-app.mjs
          node --check site/sw.js
      - name: Test web transport contracts
        run: node --test tests_web/*.test.mjs

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle -p android assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: codepc-link-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
