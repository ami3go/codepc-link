name: Bug report
description: Report a reproducible problem in CodePC Link
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Do not include passwords, tokens, or private network credentials.
  - type: input
    id: version
    attributes:
      label: CodePC Link version/commit
      placeholder: v0.x.y or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Linux distribution, BlueZ, NetworkManager, Cockpit, browser/Android versions, and Bluetooth adapter where relevant.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets and private data before pasting logs.
      render: shell
