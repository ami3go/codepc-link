[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codepc-link"
version = "0.0.0.dev0"
description = "BLE discovery, status, and recovery companion for headless Linux mini-PC systems"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "CodePC Link contributors" }]
keywords = ["bluetooth", "ble", "cockpit", "linux", "headless", "networking"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "dbus-next>=0.2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
codepc-link = "codepc_link.cli:main"

[project.urls]
Homepage = "https://ami3go.github.io/codepc-link/"
Repository = "https://github.com/ami3go/codepc-link"
Issues = "https://github.com/ami3go/codepc-link/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
